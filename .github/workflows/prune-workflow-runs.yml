name: Prune workflow run history

on:
  schedule:
    # Daily at 07:43 UTC. Retain completed runs for a rolling seven-day window.
    - cron: "43 7 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: prune-workflow-runs
  cancel-in-progress: false

jobs:
  prune:
    name: Delete completed runs older than one week
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete expired workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date --utc --date='7 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          deleted=0

          while IFS= read -r run_id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            deleted=$((deleted + 1))
          done < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100&created=%3C${cutoff}" \
              --jq '.workflow_runs[] | select(.status == "completed") | .id'
          )

          echo "Deleted ${deleted} completed workflow run(s) created before ${cutoff}."
